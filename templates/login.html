<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ — Solar</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="brand login-brand"><span class="sun">✦</span><div><strong>Solar</strong><small>AI BUILD STUDIO</small></div></div><h1>เข้าสู่ระบบ</h1><p>พื้นที่สำหรับผู้ใช้งานที่ได้รับอนุญาต</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">ชื่อผู้ใช้</label><input id="username" name="username" autocomplete="username" required maxlength="128"><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">เข้าสู่ Solar</button></form><small class="login-foot">ข้อมูลการสนทนาไม่ถูกบันทึกโดยแอปนี้</small></main></body>
</html>
